name: ZRE Branch Validation

on:
  push:
    branches:
      - 'work/**'
      - 'develop/2.6.3'
      - 'develop/2.6.4'
      - 'develop/2.6.5'
      - 'develop/2.6.5.1'
      - 'release-2.6.5'
      - 'release-2.6.5.1'
      - 'release-2.6.4'
      - 'release-2.6.3'
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q server tests updater.py

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v

      - name: Run frontend regression tests
        run: |
          node tests/frontend_recovery.cjs
          node tests/frontend_race_plan.cjs
          node tests/frontend_release_263.cjs
          node tests/frontend_release_264.cjs
          node tests/frontend_screen_admin_265.cjs
          node tests/frontend_screen_admin_2651.cjs
          node tests/frontend_kpi_library_265.cjs
          node tests/frontend_kpi_workflows_265.cjs
          node tests/frontend_practice_266.cjs

      - name: Server and WebSocket demo smoke
        if: contains(github.ref, '2.6.4') || contains(github.ref, '2.6.5')
        run: python diagnostics/smoke_264.py

  practice-visual:
    if: github.event_name == 'pull_request' && github.head_ref == 'develop/2.6.6-practice'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing runtime and headless browser test tools
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Browser layout QA at 1366, 1920 and 2560
        run: python diagnostics/practice_visual_266.py
      - name: Archive actual Chromium screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: practice-266-chromium-screenshots
          path: diagnostics/practice-screenshots/
          if-no-files-found: warn

  windows-test-install:
    if: github.ref == 'refs/heads/develop/2.6.5.1'
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install chromium
      - name: Parse Windows scripts before execution
        shell: powershell
        run: |
          foreach ($name in @('install_test_build.ps1','zre_launch.ps1')) {
            $tokens=$null; $parseErrors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $name),[ref]$tokens,[ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Actual Windows installer and same launcher across two restarts
        run: python diagnostics/windows_test_build_2651.py

  release-263:
    if: github.ref == 'refs/heads/release-2.6.3'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish the validated 2.6.3 commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c 'import json; m=json.load(open("version.json")); assert m["version"]=="2.6.3" and m["archive_ref"]=="release-2.6.3"'
          if gh release view v2.6.3 >/dev/null 2>&1; then
            tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v2.6.3" --jq '.object.sha')
            if [ "$tag_sha" = "$GITHUB_SHA" ]; then exit 0; fi
            # Replace only the known pre-activation candidate; never a live release.
            test "$tag_sha" = "48b636bae3dc121e329182722b94b9d447ce96fb"
            main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            test "$main_sha" = "4eefa802f5d532b04c0a5647c03a0121bfbb9854"
            gh release delete v2.6.3 --cleanup-tag --yes
          fi
          gh release create v2.6.3 --target "$GITHUB_SHA" --title "ZRE Core 2.6.3" --notes-file diagnostics/QA-2.6.3.md --latest

  release-264:
    if: github.ref == 'refs/heads/release-2.6.4'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish validated ZRE Core 2.6.4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c 'import json; m=json.load(open("version.json")); assert m["version"]=="2.6.4" and m["archive_ref"]=="release-2.6.4"'
          if gh release view v2.6.4 >/dev/null 2>&1; then
            tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v2.6.4" --jq '.object.sha')
            test "$tag_sha" = "$GITHUB_SHA"
            exit 0
          fi
          gh release create v2.6.4 --target "$GITHUB_SHA" --title "ZRE Core 2.6.4" --notes-file diagnostics/QA-2.6.4.md --latest

  release-265:
    if: github.ref == 'refs/heads/release-2.6.5'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish validated ZRE Core 2.6.5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c 'import json; m=json.load(open("version.json")); assert m["version"]=="2.6.5" and m["archive_ref"]=="release-2.6.5"'
          if gh release view v2.6.5 >/dev/null 2>&1; then
            tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v2.6.5" --jq '.object.sha')
            test "$tag_sha" = "$GITHUB_SHA"
            exit 0
          fi
          gh release create v2.6.5 --target "$GITHUB_SHA" --title "ZRE Core 2.6.5" --notes-file diagnostics/QA-2.6.5.md --latest


  release-2651:
    if: github.ref == 'refs/heads/release-2.6.5.1'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish validated ZRE Core 2.6.5.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c 'import json; m=json.load(open("version.json")); assert m["version"]=="2.6.5.1" and m["archive_ref"]=="release-2.6.5.1" and m["channel"]=="stable"'
          if gh release view v2.6.5.1 >/dev/null 2>&1; then
            tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v2.6.5.1" --jq '.object.sha')
            test "$tag_sha" = "$GITHUB_SHA"
            exit 0
          fi
          gh release create v2.6.5.1 --target "$GITHUB_SHA" --title "ZRE Core 2.6.5.1" --notes "Visual screen builder, test/stable updater hardening, Windows runtime validation, and 2.6.5 compatibility fixes." --latest
