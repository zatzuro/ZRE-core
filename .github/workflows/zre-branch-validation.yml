name: ZRE Branch Validation

on:
  push:
    branches:
      - 'work/**'
      - 'develop/2.6.3'
      - 'develop/2.6.4'
      - 'develop/2.6.5'
      - 'develop/2.6.5.1'
      - 'release-2.6.5'
      - 'release-2.6.5.1'
      - 'release-2.6.6'
      - 'release-2.6.6.1'
      - 'release-2.6.7'
      - 'release-2.6.4'
      - 'release-2.6.3'
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q server tests updater.py

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v

      - name: Run frontend regression tests
        run: |
          node tests/frontend_recovery.cjs
          node tests/frontend_race_plan.cjs
          node tests/frontend_release_263.cjs
          node tests/frontend_release_264.cjs
          node tests/frontend_screen_admin_265.cjs
          node tests/frontend_screen_admin_2651.cjs
          node tests/frontend_kpi_library_265.cjs
          node tests/frontend_kpi_workflows_265.cjs
          node tests/frontend_practice_266.cjs
          node tests/frontend_quali_266.cjs
          node tests/frontend_race_v2_266.cjs
          node tests/frontend_screen_menu_2661.cjs
          node tests/frontend_functional_267.cjs
          node tests/frontend_practice_2671.cjs

      - name: Server and WebSocket demo smoke
        if: contains(github.ref, '2.6.4') || contains(github.ref, '2.6.5') || startsWith(github.head_ref, 'develop/2.6.6') || startsWith(github.head_ref, 'develop/2.6.7') || (github.ref == 'refs/heads/release-2.6.6' || github.ref == 'refs/heads/release-2.6.6.1' || github.ref == 'refs/heads/release-2.6.7')
        run: python diagnostics/smoke_264.py

  practice-visual:
    if: github.ref == 'refs/heads/release-2.6.6' || github.ref == 'refs/heads/release-2.6.6.1' || github.ref == 'refs/heads/release-2.6.7' || github.event_name == 'pull_request' && (github.head_ref == 'develop/2.6.6-practice' || github.head_ref == 'develop/2.6.6-quali' || github.head_ref == 'develop/2.6.6-race-v2' || github.head_ref == 'develop/2.6.6.1-screen-menu' || github.head_ref == 'develop/2.6.7-functionality-storage-quali-race' || github.head_ref == 'develop/2.6.7.1-navigation-controls-black-theme' || github.ref == 'refs/heads/release-2.6.7')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing runtime and headless browser test tools
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Browser layout QA at 1366, 1920 and 2560
        run: |
          python diagnostics/practice_visual_266.py
          if [ "$GITHUB_HEAD_REF" = "develop/2.6.6-quali" ] || [ "$GITHUB_HEAD_REF" = "develop/2.6.6-race-v2" ] || [ "$GITHUB_HEAD_REF" = "develop/2.6.6.1-screen-menu" ] || [ "$GITHUB_REF" = "refs/heads/release-2.6.6" ] || [ "$GITHUB_HEAD_REF" = "develop/2.6.7-functionality-storage-quali-race" ] || [ "$GITHUB_HEAD_REF" = "develop/2.6.7.1-navigation-controls-black-theme" ] || [ "$GITHUB_REF" = "refs/heads/release-2.6.6.1" ] || [ "$GITHUB_REF" = "refs/heads/release-2.6.7" ]; then python diagnostics/quali_visual_266.py; fi
          if [ "$GITHUB_HEAD_REF" = "develop/2.6.6-race-v2" ] || [ "$GITHUB_HEAD_REF" = "develop/2.6.6.1-screen-menu" ] || [ "$GITHUB_REF" = "refs/heads/release-2.6.6" ] || [ "$GITHUB_HEAD_REF" = "develop/2.6.7-functionality-storage-quali-race" ] || [ "$GITHUB_HEAD_REF" = "develop/2.6.7.1-navigation-controls-black-theme" ] || [ "$GITHUB_REF" = "refs/heads/release-2.6.6.1" ] || [ "$GITHUB_REF" = "refs/heads/release-2.6.7" ]; then python diagnostics/race_v2_visual_266.py; python diagnostics/senior_266_browser.py; fi
          if [ "$GITHUB_HEAD_REF" = "develop/2.6.6.1-screen-menu" ] || [ "$GITHUB_HEAD_REF" = "develop/2.6.7-functionality-storage-quali-race" ] || [ "$GITHUB_HEAD_REF" = "develop/2.6.7.1-navigation-controls-black-theme" ] || [ "$GITHUB_REF" = "refs/heads/release-2.6.6.1" ] || [ "$GITHUB_REF" = "refs/heads/release-2.6.7" ]; then python diagnostics/screen_menu_2661_browser.py; fi
          if [ "$GITHUB_HEAD_REF" = "develop/2.6.7-functionality-storage-quali-race" ] || [ "$GITHUB_HEAD_REF" = "develop/2.6.7.1-navigation-controls-black-theme" ] || [ "$GITHUB_REF" = "refs/heads/release-2.6.7" ]; then python diagnostics/functional_267_browser.py; fi
      - name: Archive actual Chromium screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: practice-266-chromium-screenshots
          path: diagnostics/practice-screenshots/
          if-no-files-found: warn
      - name: Archive Quali screenshots
        if: always() && (github.head_ref == 'develop/2.6.6-quali' || github.head_ref == 'develop/2.6.6-race-v2' || github.head_ref == 'develop/2.6.6.1-screen-menu' || github.head_ref == 'develop/2.6.7-functionality-storage-quali-race' || github.head_ref == 'develop/2.6.7.1-navigation-controls-black-theme')
        uses: actions/upload-artifact@v4
        with:
          name: quali-266-chromium-screenshots
          path: diagnostics/quali-screenshots/
          if-no-files-found: warn
      - name: Archive Carrera V2 screenshots
        if: always() && (github.head_ref == 'develop/2.6.6-race-v2' || github.head_ref == 'develop/2.6.6.1-screen-menu' || github.head_ref == 'develop/2.6.7-functionality-storage-quali-race' || github.head_ref == 'develop/2.6.7.1-navigation-controls-black-theme' || github.ref == 'refs/heads/release-2.6.6.1' || github.ref == 'refs/heads/release-2.6.7')
        uses: actions/upload-artifact@v4
        with:
          name: race-v2-266-chromium-screenshots
          path: |
            diagnostics/race-v2-screenshots/
            diagnostics/senior-266-screenshots/
            diagnostics/screen-menu-2661-screenshots/
            diagnostics/functionality-267-screenshots/
          if-no-files-found: warn

  windows-test-install:
    if: github.ref == 'refs/heads/develop/2.6.5.1' || github.ref == 'refs/heads/release-2.6.7'
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install chromium
      - name: Parse Windows scripts before execution
        shell: powershell
        run: |
          foreach ($name in @('install_test_build.ps1','zre_launch.ps1')) {
            $tokens=$null; $parseErrors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $name),[ref]$tokens,[ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Actual Windows installer and same launcher across two restarts
        if: github.ref == 'refs/heads/develop/2.6.5.1'
        run: python diagnostics/windows_test_build_2651.py
      - name: Windows ZRE 2.6.7 recovery and runtime smoke
        if: github.ref == 'refs/heads/release-2.6.7'
        shell: powershell
        run: |
          python -m unittest discover -s tests -p 'test_session_*267.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Windows session storage/recovery regression failed' }
          python diagnostics/smoke_264.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows runtime smoke failed' }
          $manifest = Get-Content -LiteralPath 'version.json' -Raw | ConvertFrom-Json
          if ($manifest.version -ne '2.6.7' -or
              $manifest.archive_ref -ne 'release-2.6.7' -or
              $manifest.channel -ne 'stable') {
            throw 'Windows stable manifest validation failed'
          }

  release-263:
    if: github.ref == 'refs/heads/release-2.6.3'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish the validated 2.6.3 commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c 'import json; m=json.load(open("version.json")); assert m["version"]=="2.6.3" and m["archive_ref"]=="release-2.6.3"'
          if gh release view v2.6.3 >/dev/null 2>&1; then
            tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v2.6.3" --jq '.object.sha')
            if [ "$tag_sha" = "$GITHUB_SHA" ]; then exit 0; fi
            # Replace only the known pre-activation candidate; never a live release.
            test "$tag_sha" = "48b636bae3dc121e329182722b94b9d447ce96fb"
            main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            test "$main_sha" = "4eefa802f5d532b04c0a5647c03a0121bfbb9854"
            gh release delete v2.6.3 --cleanup-tag --yes
          fi
          gh release create v2.6.3 --target "$GITHUB_SHA" --title "ZRE Core 2.6.3" --notes-file diagnostics/QA-2.6.3.md --latest

  release-264:
    if: github.ref == 'refs/heads/release-2.6.4'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish validated ZRE Core 2.6.4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c 'import json; m=json.load(open("version.json")); assert m["version"]=="2.6.4" and m["archive_ref"]=="release-2.6.4"'
          if gh release view v2.6.4 >/dev/null 2>&1; then
            tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v2.6.4" --jq '.object.sha')
            test "$tag_sha" = "$GITHUB_SHA"
            exit 0
          fi
          gh release create v2.6.4 --target "$GITHUB_SHA" --title "ZRE Core 2.6.4" --notes-file diagnostics/QA-2.6.4.md --latest

  release-265:
    if: github.ref == 'refs/heads/release-2.6.5'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish validated ZRE Core 2.6.5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c 'import json; m=json.load(open("version.json")); assert m["version"]=="2.6.5" and m["archive_ref"]=="release-2.6.5"'
          if gh release view v2.6.5 >/dev/null 2>&1; then
            tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v2.6.5" --jq '.object.sha')
            test "$tag_sha" = "$GITHUB_SHA"
            exit 0
          fi
          gh release create v2.6.5 --target "$GITHUB_SHA" --title "ZRE Core 2.6.5" --notes-file diagnostics/QA-2.6.5.md --latest


  release-2651:
    if: github.ref == 'refs/heads/release-2.6.5.1'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish validated ZRE Core 2.6.5.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c 'import json; m=json.load(open("version.json")); assert m["version"]=="2.6.5.1" and m["archive_ref"]=="release-2.6.5.1" and m["channel"]=="stable"'
          if gh release view v2.6.5.1 >/dev/null 2>&1; then
            tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v2.6.5.1" --jq '.object.sha')
            test "$tag_sha" = "$GITHUB_SHA"
            exit 0
          fi
          gh release create v2.6.5.1 --target "$GITHUB_SHA" --title "ZRE Core 2.6.5.1" --notes "Visual screen builder, test/stable updater hardening, Windows runtime validation, and 2.6.5 compatibility fixes." --latest

  release-266:
    if: github.ref == 'refs/heads/release-2.6.6'
    needs: [validate, practice-visual]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish validated ZRE Core 2.6.6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c 'import json; m=json.load(open("version.json")); assert m["version"]=="2.6.6" and m["archive_ref"]=="release-2.6.6" and m["channel"]=="stable"'
          if gh release view v2.6.6 >/dev/null 2>&1; then
            tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v2.6.6" --jq '.object.sha')
            test "$tag_sha" = "$GITHUB_SHA"
            exit 0
          fi
          gh release create v2.6.6 --target "$GITHUB_SHA" --title "ZRE Core 2.6.6" --notes-file diagnostics/QA-2.6.6.md --latest

  release-2661:
    if: github.ref == 'refs/heads/release-2.6.6.1'
    needs: [validate, practice-visual]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish validated ZRE Core 2.6.6.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c 'import json; m=json.load(open("version.json")); assert m["version"]=="2.6.6.1" and m["archive_ref"]=="release-2.6.6.1" and m["channel"]=="stable"'
          if gh release view v2.6.6.1 >/dev/null 2>&1; then
            tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v2.6.6.1" --jq '.object.sha')
            test "$tag_sha" = "$GITHUB_SHA"
            exit 0
          fi
          gh release create v2.6.6.1 --target "$GITHUB_SHA" --title "ZRE Core 2.6.6.1" --notes-file diagnostics/QA-2.6.6.1.md --latest

  release-267:
    if: github.ref == 'refs/heads/release-2.6.7'
    needs: [validate, practice-visual, windows-test-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish ZRE Core 2.6.7 for first real iRacing field test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c 'import json; m=json.load(open("version.json")); assert m["version"]=="2.6.7" and m["archive_ref"]=="release-2.6.7" and m["channel"]=="stable"'
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$main_sha" = "$GITHUB_SHA"
          if gh release view v2.6.7 >/dev/null 2>&1; then
            tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v2.6.7" --jq '.object.sha')
            test "$tag_sha" = "$GITHUB_SHA"
            exit 0
          fi
          gh release create v2.6.7 --target "$GITHUB_SHA" --title "ZRE Core 2.6.7" --notes-file diagnostics/QA-2.6.7.md --latest
