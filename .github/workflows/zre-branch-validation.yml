name: ZRE Branch Validation

on:
  push:
    branches:
      - work/coach-map-2.5.6
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q server tests updater.py

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v

      - name: Run frontend regression tests
        run: node tests/frontend_recovery.cjs
