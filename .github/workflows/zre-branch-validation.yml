name: ZRE Branch Validation

on:
  push:
    branches:
      - 'work/**'
      - 'develop/2.6.3'
      - 'release-2.6.3'
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q server tests updater.py

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v

      - name: Run frontend regression tests
        run: |
          node tests/frontend_recovery.cjs
          node tests/frontend_race_plan.cjs
          node tests/frontend_release_263.cjs

  release-263:
    if: github.ref == 'refs/heads/release-2.6.3'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish the validated 2.6.3 commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c 'import json; m=json.load(open("version.json")); assert m["version"]=="2.6.3" and m["archive_ref"]=="release-2.6.3"'
          gh release create v2.6.3 --target "$GITHUB_SHA" --title "ZRE Core 2.6.3" --notes-file diagnostics/QA-2.6.3.md --latest
