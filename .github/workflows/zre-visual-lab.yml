name: ZRE Visual Lab · QA and static-only publish

on:
  push:
    branches:
      - develop/visual-lab-web
    paths:
      - 'preview/**'
      - 'tools/build_visual_lab.py'
      - 'diagnostics/visual_lab_browser.py'
      - 'tests/test_visual_lab_build.py'
      - 'web/**'
      - '.github/workflows/zre-visual-lab.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zre-visual-lab-publish
  cancel-in-progress: false

jobs:
  verify-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Static build and targeted checks
        run: |
          python -m unittest discover -s tests -p test_visual_lab_build.py -v
          python tools/build_visual_lab.py --out dist/visual-lab --branch "$GITHUB_REF_NAME" --sha "$GITHUB_SHA"
      - name: Install Chromium for rendered-browser QA
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser smoke · synthetic screens, scenarios, no productive network
        run: python diagnostics/visual_lab_browser.py
      - name: Save visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zre-visual-lab-browser-\${{ github.sha }}
          path: diagnostics/visual-lab-screenshots/
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish ONLY static Visual Lab to gh-pages
        if: success() && github.ref == 'refs/heads/develop/visual-lab-web'
        env:
          SOURCE_SHA: \${{ github.sha }}
          REPO: \${{ github.repository }}
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cd "$tmp"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:\${GH_TOKEN}@github.com/\${REPO}.git"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch -q --depth=1 origin gh-pages
            git checkout -q -B gh-pages FETCH_HEAD
            git rm -qr --ignore-unmatch .
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          else
            git checkout -q --orphan gh-pages
          fi
          cp -a "$GITHUB_WORKSPACE/dist/visual-lab/." ./
          git add -A
          if git diff --cached --quiet; then
            echo "gh-pages already represents $SOURCE_SHA — no redundant commit"
          else
            git commit -qm "Visual Lab preview from \${SOURCE_SHA}"
            git push -q origin HEAD:gh-pages
          fi
          echo "Only public synthetic assets were published; main and Windows release untouched."
